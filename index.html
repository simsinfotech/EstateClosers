  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      ? window.origin
      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};

    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            let totalLen = 0;

              const { done, value } = await reader.read();

          return;
        }

          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

op: 1px solid #16222A; border-bottom: 1px solid #16222A; background: #0C1419\">\n    <div class=\"wrap\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 0\">\n      <div class=\"proof\" style=\"padding: 26px 20px 26px 0\"><div class=\"cond\" style=\"font-size: 26px\">RERA<\u002Fdiv><div style=\"font-size: 13.5px; color: #A3A7B0; margin-top: 4px\">Registered brokerage, Karnataka<\u002Fdiv><\u002Fdiv>\n      <div class=\"proof\" style=\"padding: 26px 20px; border-left: 1px solid #16222A\"><div class=\"cond\" style=\"font-size: 26px\">6 cities<\u002Fdiv><div style=\"font-size: 13.5px; color: #A3A7B0; margin-top: 4px\">Bengaluru, Hyderabad, Chennai, Pune, Mumbai, Delhi<\u002Fdiv><\u002Fdiv>\n      <div class=\"proof\" style=\"padding: 26px 20px; border-left: 1px solid #16222A\"><div class=\"cond\" style=\"font-size: 26px; color: #12D6F2\">₹2.7 Cr<\u002Fdiv><div style=\"font-size: 13.5px; color: #A3A7B0; margin-top: 4px\">Commissions earned by Estate Hive in 3 months<\u002Fdiv><\u002Fdiv>\n      <div class=\"proof\" style=\"padding: 26px 0 26px 20px; border-left: 1px solid #16222A\"><div class=\"cond\" style=\"font-size: 26px\">15 years<\u002Fdiv><div style=\"font-size: 13.5px; color: #A3A7B0; margin-top: 4px\">Building sales businesses<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"secrets\" style=\"padding: 96px 0\">\n    <div class=\"wrap\">\n      <div style=\"text-align: center; max-width: 820px; margin: 0 auto\">\n        <div class=\"mono\" style=\"font-size: 12px; color: #5CE6FA\">What you’ll discover<\u002Fdiv>\n        <h2 class=\"disp\" style=\"margin: 16px 0 0; font-size: clamp(30px, 4.2vw, 54px); line-height: 1.04\">Three secrets <span style=\"color: #12D6F2\">most agents never learn.<\u002Fspan><\u002Fh2>\n        <p style=\"margin: 16px auto 0; font-size: 17px; line-height: 1.6; color: #A3A7B0; max-width: 640px\">Each one breaks the belief that stops good people from ever starting.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px\">\n        <div class=\"lift\" style=\"border: 1px solid #1B2A31; background: #0C1419; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><div class=\"disp\" style=\"font-size: 56px; line-height: 1; color: #12D6F2\">#1<\u002Fdiv><div class=\"mono\" style=\"font-size: 10.5px; color: #8B8F99\">The opportunity<\u002Fdiv><\u002Fdiv>\n          <h3 style=\"margin: 0; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 23px; line-height: 1.25\">Why one closing can beat a month’s salary<\u002Fh3>\n          <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #16222A; padding: 14px 16px; font-size: 14.5px; line-height: 1.5; color: #A3A7B0\"><span style=\"color: #FF9A73; font-weight: 700\">You might think:<\u002Fspan> “Real estate is commission roulette.”<\u002Fdiv>\n          <div style=\"font-size: 15.5px; line-height: 1.6; color: #C9CCD3\">You’ll see the real rupee figure one closing pays, and exactly how many deals make your month, as plain arithmetic.<\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"margin-top: auto\"><div style=\"display: flex; align-items: flex-end; gap: 6px; height: 70px; border-bottom: 1px solid #2A3B44\"><div class=\"bar\" style=\"flex: 1; height: 8%; border-radius: 6px 6px 0 0; background: #2A3B44; animation-delay: 0.1s\"><\u002Fdiv><div class=\"bar\" style=\"flex: 1; height: 22%; border-radius: 6px 6px 0 0; background: #1E5560; animation-delay: 0.3s\"><\u002Fdiv><div class=\"bar\" style=\"flex: 1; height: 52%; border-radius: 6px 6px 0 0; background: #0E9DB6; animation-delay: 0.5s\"><\u002Fdiv><div class=\"bar\" style=\"flex: 1; height: 100%; border-radius: 6px 6px 0 0; background: #12D6F2; animation-delay: 0.7s\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"lift\" style=\"border: 1px solid #1B2A31; background: #0C1419; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><div class=\"disp\" style=\"font-size: 56px; line-height: 1; color: #12D6F2\">#2<\u002Fdiv><div class=\"mono\" style=\"font-size: 10.5px; color: #8B8F99\">You<\u002Fdiv><\u002Fdiv>\n          <h3 style=\"margin: 0; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 23px; line-height: 1.25\">How a complete beginner reaches a first closing in 90 days<\u002Fh3>\n          <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #16222A; padding: 14px 16px; font-size: 14.5px; line-height: 1.5; color: #A3A7B0\"><span style=\"color: #FF9A73; font-weight: 700\">You might think:<\u002Fspan> “I’ve never sold property. I’d need years.”<\u002Fdiv>\n          <div style=\"font-size: 15.5px; line-height: 1.6; color: #C9CCD3\">The week-by-week sequence our own team follows: 30 days training, 30 days in the field on live projects, 30 days to earn.<\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"margin-top: auto\"><div style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"height: 6px; border-radius: 3px; background: #16222A; overflow: hidden\"><div class=\"trackfill\" style=\"height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1E5560, #12D6F2)\"><\u002Fdiv><\u002Fdiv><div style=\"display: flex; justify-content: space-between; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 13px; color: #A3A7B0\"><span>Train<\u002Fspan><span>Field<\u002Fspan><span style=\"color: #12D6F2\">Earn<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"lift\" style=\"border: 2px solid #12D6F2; background: #0A1A21; border-radius: 26px; padding: 28px; display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline\"><div class=\"disp\" style=\"font-size: 56px; line-height: 1; color: #12D6F2\">#3<\u002Fdiv><div class=\"mono\" style=\"font-size: 10.5px; color: #8B8F99\">The buyers<\u002Fdiv><\u002Fdiv>\n          <h3 style=\"margin: 0; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 23px; line-height: 1.25\">How to get in front of serious buyers without spending on ads<\u002Fh3>\n          <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #16222A; padding: 14px 16px; font-size: 14.5px; line-height: 1.5; color: #A3A7B0\"><span style=\"color: #FF9A73; font-weight: 700\">You might think:<\u002Fspan> “Even if I learn, where will the buyers come from?”<\u002Fdiv>\n          <div style=\"font-size: 15.5px; line-height: 1.6; color: #C9CCD3\">The pre-qualified site visit model: buyers found, qualified and booked, so you show up and close.<\u002Fdiv>\n          <div aria-hidden=\"true\" style=\"margin-top: auto\"><div style=\"display: flex; align-items: center; gap: 12px; border-radius: 14px; background: #12D6F2; color: #031318; padding: 12px 14px\"><div style=\"width: 38px; height: 38px; border-radius: 10px; background: #031318; color: #12D6F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg><\u002Fdiv><div><div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">Site visit booked for you<\u002Fdiv><div style=\"font-size: 12.5px\">Buyer qualified · confirmed by pre-sales<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u00 ; align-items: baseline\"><label for=\"deals\" style=\"font-weight: 800; font-size: 15px\">Closings this month<\u002Flabel><span class=\"cond\" style=\"font-size: 28px\">{{ deals }}<\u002Fspan><\u002Fdiv>\n            <input id=\"deals\" type=\"range\" min=\"0\" max=\"6\" step=\"1\" value=\"{{ deals }}\" sc-camel-on-input=\"{{ setDeals }}\">\n            <div style=\"display: flex; justify-content: space-between; font-size: 12.5px; color: #5C6069\"><span>0<\u002Fspan><span>6<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 380px; min-width: 0; background: #070C10; color: #F5F5F2; border-radius: 26px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; gap: 20px\">\n          <div>\n            <div class=\"mono\" style=\"font-size: 11.5px; font-weight: 600; color: #A3A7B0\">Example month<\u002Fdiv>\n            <div aria-live=\"polite\" class=\"disp\" style=\"font-size: clamp(48px, 6vw, 76px); line-height: 1; margin-top: 14px; color: #12D6F2\">{{ monthTxt }}<\u002Fdiv>\n            <div style=\"font-size: 15px; color: #C9CCD3; margin-top: 10px\">{{ deals }} × {{ perDealTxt }} per closing<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 10px; border-radius: 5px; background: #1B2A31; overflow: hidden\"><div style=\"height: 10px; border-radius: 5px; background: #12D6F2; width: {{ meterPct }}; transition: width .4s ease\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.5; color: #A3A7B0\">Example figures, not an offer or a guarantee. Commission is paid only after the buyer signs and the developer pays, so the first payout arrives after the first “yes”.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 90-DAY PATH -->\n  <section style=\"padding: 104px 0\">\n    <div class=\"wrap\">\n      <div class=\"mono\" style=\"font-size: 12px; font-weight: 600; color: #5CE6FA\">Secret #2 · a preview<\u002Fdiv>\n      <h2 class=\"disp\" style=\"margin: 16px 0 0; font-size: clamp(30px, 4.2vw, 54px); line-height: 1.04; max-width: 900px\">Train. Field. <span style=\"color: #12D6F2\">Earn.<\u002Fspan><\u002Fh2>\n      <div aria-hidden=\"true\" style=\"margin-top: 48px; height: 6px; border-radius: 3px; background: #16222A; overflow: hidden\"><div class=\"trackfill\" style=\"height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1E5560, #12D6F2)\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"margin-top: 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 16px\">\n        <div class=\"lift\" style=\"border: 1px solid #1B2A31; border-radius: 22px; padding: 28px; background: #0C1419\"><div class=\"cond\" style=\"font-size: 44px; color: #8B8F99; line-height: 1\">01–30<\u002Fdiv><div style=\"font-weight: 800; font-size: 21px; margin-top: 14px\">Train<\u002Fdiv><div style=\"font-size: 15.5px; line-height: 1.6; color: #A3A7B0; margin-top: 8px\">Projects, locations, the buyer’s questions and the answers that close. Learnt from deals happening this month.<\u002Fdiv><\u002Fdiv>\n        <div class=\"lift\" style=\"border: 1px solid #1B2A31; border-radius: 22px; padding: 28px; background: #0C1419\"><div class=\"cond\" style=\"font-size: 44px; color: #3FB8CC; line-height: 1\">31–60<\u002Fdiv><div style=\"font-weight: 800; font-size: 21px; margin-top: 14px\">Field<\u002Fdiv><div style=\"font-size: 15.5px; line-height: 1.6; color: #A3A7B0; margin-top: 8px\">Site visits on live inventory, alongside closers who do it every day.<\u002Fdiv><\u002Fdiv>\n        <div class=\"lift\" style=\"border: 2px solid #12D6F2; border-radius: 22px; padding: 28px; background: #0A1A21\"><div class=\"cond\" style=\"font-size: 44px; color: #12D6F2; line-height: 1\">61–90<\u002Fdiv><div style=\"font-weight: 800; font-size: 21px; margin-top: 14px\">Earn<\u002Fdiv><div style=\"font-size: 15.5px; line-height: 1.6; color: #C9CCD3; margin-top: 8px\">Work toward your first closing, with a route to pre-qualified site visits.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top: 20px; font-size: 15px; color: #A3A7B0\">Already working? Start on evenings and weekends; in the masterclass we show the milestone where switching becomes safe.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- AFTER THE MASTERCLASS -->\n  <section style=\"padding: 0 0 104px\">\n    <div class=\"wrap\">\n      <div style=\"border: 1px solid #1B2A31; border-radius: 28px; padding: clamp(28px, 4vw, 48px); background: #0C1419\">\n        <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 20px\"><div class=\"mono\" style=\"font-size: 12px; font-weight: 600; color: #5CE6FA\">Secret #3 · where it leads<\u002Fdiv><img src=\"51d6e627-9f40-492d-9e88-351edf5efbe2\" alt=\"\" style=\"width: 72px; height: 72px; border-radius: 18px; display: block; box-shadow: 0 0 40px rgba(18,214,242,0.35)\"><\u002Fdiv>\n        <h2 class=\"disp\" style=\"margin: 16px 0 0; font-size: clamp(28px, 3.4vw, 44px); line-height: 1.05\">A course ends. <span style=\"color: #12D6F2\">This becomes a career.<\u002Fspan><\u002Fh2>\n        <div style=\"margin-top: 36px; display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch\">\n          <div style=\"flex: 1 1 220px; min-width: 0; border-radius: 18px; background: #070C10; border: 1px solid #1B2A31; padding: 22px\"><div class=\"mono\" style=\"font-size: 11px; font-weight: 600; color: #8B8F99\">Step 1 · ₹199<\u002Fdiv><div style=\"font-weight: 800; font-size: 19px; margin-top: 10px\">The masterclass<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.55; color: #A3A7B0; margin-top: 6px\">The maths, the path and the three skills that decide who makes it.<\u002Fdiv><\u002Fdiv>\n          <div class=\"flow-arrow\" aria-hidden=\"true\" style=\"display: flex; align-items: center; color: #12D6F2\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n          <div style=\"flex: 1 1 220px; min-width: 0; border-radius: 18px; background: #070C10; border: 1px solid #1B2A31; padding: 22px\"><div class=\"mono\" style=\"font-size: 11px; font-weight: 600; color: #8B8F99\">Step 2 · optional<\u002Fdiv><div style=\"font-weight: 800; font-size: 19px; margin-top: 10px\">The JusClosers program<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.55; color: #A3A7B0; margin-top: 6px\">90 days: train, field, earn. Limited seats per batch.<\u002Fdiv><\u002Fdiv>\n          <div class=\"flow-arrow\" aria-hidden=\"true\" style=\"display: flex; align-items: center; color: #12D6F2\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n          <div style=\"flex: 1 1 220px; min-width: 0; border-radius: 18px; background: #12D6F2; color: #031318; padding: 22px\"><div class=\"mono\" style=\"font-size: 11px; font-weight: 600\">Step 3<\u002Fdiv><div style=\"font-weight: 800; font-size: 19px; margin-top: 10px\">Close real deals<\u002Fdiv><div style=\"font-size: 14.5px; line-height: 1.55; margin-top: 6px\">Join the Estate Hive team or close as a Propli Partner, with buyers found, qualified and booked for you.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"story\" style=\"padding: 104px 0; background: #0C1419; border-top: 1px solid #16222A; border-bottom: 1px solid #16222A\">\n    <div class=\"wrap\">\n      <div style=\"max-width: 860px\">\n        <div class=\"mono\" style=\"font-size: 12px; color: #5CE6FA\">The founder’s story<\u002Fdiv>\n        <h2 class=\"disp\" style=\"margin: 16px 0 0; font-size: clamp(30px, 4.2vw, 54px); line-height: 1.04\">From geoscience to closing deals. <span style=\"color: #12D6F2\">And why it wasn’t about talent.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"margin-top: 52px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start\">\n        <div class=\"story-side\" style=\"flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n          <div style=\"position: relative; width: 100%; max-width: 380px\">\n            <div aria-hidden=\"true\" style=\"position: absolute; inset: -10px; border-radius: 34px; background: radial-gradient(circle at 50% 30%, rgba(18,214,242,0.35), rgba(18,214,242,0) 70%)\"><\u002Fdiv>\n            <img src=\"16219bad-06d8-403a-bb1f-dd3bd821865c\" alt=\"{{ founderName }}, founder of Estate Hive and JusClosers\" style=\"position: relative; display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 28px; border: 1.5px solid #12D6F2; box-shadow: 0 30px 60px rgba(0,0,0,0.45)\">\n            <div style=\"position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; background: rgba(7,12,16,0.88); border: 1px solid #163640; border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: #F5F5F2\"><span class=\"live\" aria-hidden=\"true\"><\u002Fspan>Teaching live<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width: 380px\">\n            <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px\">{{ founderName }}<\u002Fdiv>\n            <div style=\"font-size: 14.5px; color: #A3A7B0; margin-top: 4px\">Founder, Estate Hive · RERA-registered brokerage<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"max-width: 380px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n            <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #1B2A31; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center\"><div class=\"cond\" style=\"font-size: 20px; color: #12D6F2; white-space: nowrap\">15 yrs<\u002Fdiv><div style=\"font-size: 12px; color: #A3A7B0; margin-top: 3px; white-space: nowrap\">in business<\u002Fdiv><\u002Fdiv>\n            <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #1B2A31; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center\"><div class=\"cond\" style=\"font-size: 20px; color: #12D6F2; white-space: nowrap\">6<\u002Fdiv><div style=\"font-size: 12px; color: #A3A7B0; margin-top: 3px; white-space: nowrap\">cities<\u002Fdiv><\u002Fdiv>\n            <div style=\"border-radius: 14px; background: #070C10; border: 1px solid #1B2A31; padding: 14px 8px; text-align: center; display: flex; flex-direction: column; justify-content: center\"><div class=\"cond\" style=\"font-size: 20px; color: #12D6F2; white-space: nowrap\">₹2.7 Cr<\u002Fdiv><div style=\"font-size: 12px; color: #A3A7B0; margin-top: 3px; white-space: nowrap\">in 3 months<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 999 1 520px; min-width: 0\">\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #070C10; border: 2px solid #2A3B44; color: #5CE6FA; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">01<\u002Fdiv><div aria-hidden=\"true\" style=\"flex: 1; width: 2px; margin-top: 6px; background: linear-gradient(#2A3B44, #12D6F2)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 30px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25\">An unlikely start<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">I didn’t begin in sales. I studied petroleum geoscience at the University of Manchester, a world of data, maps and models. It taught me to trust numbers over noise.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #070C10; border: 2px solid #2A3B44; color: #5CE6FA; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">02<\u002Fdiv><div aria-hidden=\"true\" style=\"flex: 1; width: 2px; margin-top: 6px; background: linear-gradient(#2A3B44, #12D6F2)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 30px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25\">Fifteen years of building<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">Since then I’ve spent about fifteen years building businesses across fintech and real estate. Every one of them lived or died on one thing: someone, somewhere, closing the sale.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #070C10; border: 2px solid #2A3B44; color: #5CE6FA; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">03<\u002Fdiv><div aria-hidden=\"true\" style=\"flex: 1; width: 2px; margin-top: 6px; background: linear-gradient(#2A3B44, #12D6F2)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 30px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25\">The wall<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">When I built Estate Hive, I hired people who were brilliant with people. Many still struggled. Nobody had trained them on the projects, shown them the maths, or put a serious buyer in front of them.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #070C10; border: 2px solid #2A3B44; color: #5CE6FA; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">04<\u002Fdiv><div aria-hidden=\"true\" style=\"flex: 1; width: 2px; margin-top: 6px; background: linear-gradient(#2A3B44, #12D6F2)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 30px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25\">The breakthrough<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">So we stopped hoping and built a system: 30 days of training, 30 days on live projects, then closing with buyers who were already qualified. Confidence stopped being a personality trait. It became a process.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #12D6F2; border: 2px solid #12D6F2; color: #031318; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">05<\u002Fdiv><div aria-hidden=\"true\" style=\"flex: 1; width: 2px; margin-top: 6px; background: linear-gradient(#2A3B44, #12D6F2)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 30px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25; color: #12D6F2\">The proof<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">That system now runs a RERA-registered brokerage across six cities, and it earned ₹2.7 Cr in commissions in just three months.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; align-items: stretch\">\n            <div style=\"display: flex; flex-direction: column; align-items: center; flex-shrink: 0\">\n              <div style=\"width: 44px; height: 44px; border-radius: 50%; background: #12D6F2; border: 2px solid #12D6F2; color: #031318; display: flex; align-items: center; justify-content: center; font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 14px\">06<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding-bottom: 0px; padding-top: 6px\">\n              <div style=\"font-family: 'Lexend', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.25; color: #12D6F2\">Why I’m opening it to you<\u002Fdiv>\n              <div style=\"font-size: 16.5px; line-height: 1.7; color: #C9CCD3; margin-top: 8px; max-width: 620px\">JusClosers is that same system, opened up. If you’re good with people and willing to learn, you shouldn’t have to figure it out alone like most agents do.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 36px; border-left: 4px solid #12D6F2; padding: 6px 0 6px 22px\">\n            <div class=\"disp\" style=\"font-size: clamp(22px, 2.6vw, 32px); line-height: 1.25\">“Confidence isn’t something you’re born with. It’s what happens when you know the numbers, the plan and the next step.”<\u002Fdiv>\n            <div style=\"margin-top: 12px; font-size: 14.5px; color: #A3A7B0\">{{ founderName }}, founder<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top: 30px\"><button type=\"button\" class=\"btn btn-hot\" sc-camel-on-click=\"{{ openForm }}\" style=\"min-height: 58px; padding: 0 28px; font-size: 16.5px\">Learn the system · ₹199<svg aria-hidden=\"true\" sc-camel-view-box=\"0 0 24 24\" style=\"width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round\"><line x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"><\u002Fline><polyline points=\"12 5 19 12 12 19\"><\u002Fpolyline><\u002Fsvg><\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <!-- AGENDA -->\n  <section style=\"padding: 104px 0; background: #F5F5F2; color: #070C10\">\n    <div class=\"wrap\" style=\"display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start\">\n      <div style=\"flex: 1 1 380px; min-width: 0\">\n        <div class=\"mono\" style=\"font-size: 12px; font-weight: 600; color: #0A7486\">The 90 minutes<\u002Fdiv>\n        <h2 class=\"disp\" style=\"margin: 16px 0 0; font-size: clamp(30px, 3.8vw, 48px); line-height: 1.05\">Timestamped. <span style=\"color: #0A7486\">So you know what you’re buying.<\u002Fspan><\u002Fh2>\n        <p s l: 'Refund' }),\n      legalDelivery: s.legal === 'Delivery', openDelivery: () => this.setState({ legal: 'Delivery' }),\n      legalEarnings: s.legal === 'Earnings', openEarnings: () => this.setState({ legal: 'Earnings' }),\n      legalContact: s.legal === 'Contact', openContact: () => this.setState({ legal: 'Contact' }),\n      modalOpen: !!s.modal, openForm: () => this.setState({ modal: true }), closeForm: () => this.setState({ modal: false }),\n      founderInitial: (p.founderName ?? 'Shamique').trim().charAt(0).toUpperCase(),\n      firstName: fName.trim().split(' ')[0] || 'there',\n      submit: () => {\n        const st = this.state || {};\n        if (!(st.fName || '').trim()) return this.setState({ error: 'Please enter your name.' });\n        if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(st.fEmail || '')) return this.setState({ error: 'Please enter a valid email.' });\n        if ((st.fWa || '').replace(/\\D/g, '').length < 10) return this.setState({ error: 'Please enter your WhatsApp number.' });\n        if (!st.fCity) return this.setState({ error: 'Please select your city.' });\n        this.setState({ done: true, error: '' });\n        fetch('https://script.google.com/macros/s/AKfycbwSI-BBhGYGpFYa_Pg7MTXWXRHeu5r3ymRZKSlIa3K1Zt9npiyAWZnLedXK3UEWVK8i/exec', {\n          method: 'POST',\n          mode: 'no-cors',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({\n            timestamp: new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),\n            name: st.fName.trim(),\n            email: st.fEmail.trim(),\n            whatsapp: st.fWa.trim(),\n            city: st.fCity\n          })\n        }).catch(() => {});\n      },\n      editForm: () => this.setState({ done: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
